locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: "Junteng Liu"
description: "Academic homepage of Junteng Liu, a first-year PhD candidate at the HKUST NLP Group."
url: https://Velocityfomoon.github.io
baseurl: "/LJT-Homepage"
repository: "Velocityfomoon/LJT-Homepage"

author:
  avatar: "profile.png"
  name: "Junteng Liu"
  bio: "First-year PhD candidate at the HKUST NLP Group, supervised by Prof. Junxian He. Research focuses on natural language processing and machine learning."
  employer: "HKUST NLP Group"
  email: "jliugi@connect.ust.hk"
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  github: "Vicent0205"
  twitter: "junteng88716710"

publication_category:
  manuscripts:
    title: 'Preprints'
  conferences:
    title: 'Conference Papers'

breadcrumbs: false
words_per_minute: 160
future: true
read_more: "disabled"
talkmap_link: false
markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"

kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6

collections:
  teaching:
    output: true
    permalink: /:collection/:path/
  publications:
    output: true
    permalink: /:collection/:path/
  portfolio:
    output: true
    permalink: /:collection/:path/
  talks:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope: {path: "", type: posts}
    values: {layout: single, author_profile: true, read_time: true, comments: true, share: true, related: true}
  - scope: {path: "", type: pages}
    values: {layout: single, author_profile: true}
  - scope: {path: "", type: teaching}
    values: {layout: single, author_profile: true, share: true, comments: true}
  - scope: {path: "", type: publications}
    values: {layout: single, author_profile: true, share: true, comments: true}
  - scope: {path: "", type: portfolio}
    values: {layout: single, author_profile: true, share: true}
  - scope: {path: "", type: talks}
    values: {layout: talk, author_profile: true, share: true}

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Etc/UTC

plugins:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

whitelist:
  - jekyll-feed
  - jekyll-gist
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-redirect-from
  - jemoji

category_archive: {type: liquid, path: /categories/}
tag_archive: {type: liquid, path: /tags/}

compress_html:
  clippings: all
  ignore: {envs: development}

include:
  - .htaccess
  - _pages
  - files
